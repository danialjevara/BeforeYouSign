name: beforeyousign
description: "An Android-first paperwork risk scanner with OCR, on-device Gemma 4 analysis, voice support, and country-aware legal-help lookup."
publish_to: 'none'
repository: https://github.com/danialjevara/beforeyousign
version: 1.0.3+4

environment:
  sdk: ">=3.5.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  background_downloader: ^9.5.4
  camera: ^0.11.0+1
  crypto: ^3.0.6
  cupertino_icons: ^1.0.8
  flutter_gemma: ^0.15.0
  flutter_map: ^8.3.0
  flutter_riverpod: ^2.5.1
  flutter_secure_storage: ^9.2.2
  flutter_tts: ^4.2.5
  geolocator: ^14.0.2
  go_router: ^14.2.0
  google_mlkit_text_recognition: 0.15.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.6.0
  image: ^4.8.0
  latlong2: ^0.9.1
  local_auth: ^2.3.0
  permission_handler: ^11.3.1
  speech_to_text: ^7.3.0
  url_launcher: ^6.3.2
  path_provider: ^2.1.5
  file_picker: ^11.0.2
  flutter_tesseract_ocr: ^0.4.30

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/tessdata/
