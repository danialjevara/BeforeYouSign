name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib test --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build arm64-only APK
        run: flutter build apk --release --target-platform android-arm64 -v

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: before-you-sign-apk-arm64
          path: build/app/outputs/flutter-apk/app-release.apk
